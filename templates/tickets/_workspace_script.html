<script>
function deleteComment(commentId) {
 if(confirm('Delete this comment? This cannot be undone.'))location.href={{ url_for('tickets.delete_comment',comment_id=0)|tojson }}.replace('/0/delete',`/${commentId}/delete`);
}
document.addEventListener('DOMContentLoaded',()=>{
 const ux=window.PostUX;if(!ux)return;
 const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
 const root=$('.ticket-view'),id=root.dataset.ticketId;
 const form=$('#comment-form'),textarea=$('#content'),send=$('#submit-comment-btn');
 let quill=null;
 if(window.Quill){
  const editor=document.createElement('div');editor.id='uxReplyEditor';textarea.before(editor);
  try{
   quill=new Quill(editor,{theme:'snow',placeholder:'Write a note for the support team…',modules:{toolbar:[['bold','italic','underline'],[{list:'ordered'},{list:'bullet'}],['link','image'],['clean']]}});
   quill.root.setAttribute('aria-label','Reply message');quill.root.setAttribute('aria-describedby','uxVisibilityNotice');
   textarea.hidden=true;textarea.required=false;
   quill.on('text-change',()=>textarea.value=quill.root.innerHTML);
   quill.getModule('toolbar').addHandler('image',()=>{
    const input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/gif,image/webp';input.onchange=async()=>{if(!input.files[0])return;try{const fd=new FormData();fd.append('file',input.files[0]);const data=await ux.request({{ url_for('editor_upload_image')|tojson }},{method:'POST',body:fd});if(!data.location)throw new Error('Image upload did not return a file.');const index=quill.getSelection()?.index??quill.getLength();quill.insertEmbed(index,'image',data.location);}catch(err){ux.toast(err.message,true);}};input.click();
   });
  }catch(_){editor.remove();textarea.hidden=false;quill=null;}
 }
 $$('[data-visibility]').forEach(b=>b.addEventListener('click',()=>{
  const publicReply=b.dataset.visibility==='public';$('#uxVisibility').value=b.dataset.visibility;
  $$('[data-visibility]').forEach(tab=>{tab.setAttribute('aria-selected',String(tab===b));tab.tabIndex=tab===b?0:-1;});
  $('#ux-composer-panel').setAttribute('aria-labelledby',b.id);
  $('#uxVisibilityNotice').textContent=publicReply?'Public reply. This message is emailed to the requester.':'Internal note. Visible to the support team; not emailed to the requester.';
  send.textContent=publicReply?'Send public reply':'Add internal note';
 }));
 const tabs=$$('[data-visibility]');tabs[0].tabIndex=-1;
 tabs.forEach((tab,i)=>tab.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=tabs[(i+1)%tabs.length];next.click();next.focus();}}));
 const canned={acknowledge:"Thanks for letting us know. We’re investigating and will share an update as soon as we have more information.",information:"Could you send the affected system or studio, when the issue started, and a screenshot of any error? That will help us narrow this down.",resolved:"We’ve applied a fix and verified the system is working. Please let us know if you’re still seeing the issue."};
 $('#uxCanned').onchange=e=>{const value=canned[e.target.value];if(!value)return;if(quill){quill.insertText(quill.getLength()-1,(quill.getLength()>1?'\n':'')+value);quill.focus();}else{textarea.value+=(textarea.value?'\n\n':'')+value;textarea.focus();}e.target.value='';};
 const drop=$('#uxDropzone'),file=$('#attachment');
 drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('ux-drag');});drop.addEventListener('dragleave',()=>drop.classList.remove('ux-drag'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('ux-drag');if(e.dataTransfer.files.length){const dt=new DataTransfer();dt.items.add(e.dataTransfer.files[0]);file.files=dt.files;file.dispatchEvent(new Event('change'));if(e.dataTransfer.files.length>1)ux.toast('One attachment per message. Only the first file was selected.');}});
 file.addEventListener('change',()=>$('#uxAttachmentStatus').textContent=file.files[0]?.name||'Images, PDFs and documents are welcome.');
 form.addEventListener('submit',e=>{if(quill)textarea.value=quill.root.innerHTML;const plain=quill?quill.getText().trim():textarea.value.trim();if(!plain&&!textarea.value.includes('<img')){e.preventDefault();$('#uxComposerError').textContent='Write a message before sending.';quill?quill.focus():textarea.focus();return;}send.disabled=true;send.textContent='Sending…';});
 const timeline=$('#uxTimeline'),savedComments=new Map($$('[data-event-kind=comment]',timeline).map(el=>[String(el.dataset.eventId),el]));
 function safeFragment(html){
  const doc=new DOMParser().parseFromString(html||'','text/html');
  $$('script,style,iframe,object,embed,form,input,button,svg,math,link,meta',doc).forEach(n=>n.remove());
  $$('*',doc.body).forEach(el=>{Array.from(el.attributes).forEach(attr=>{if(/^on/i.test(attr.name)||attr.name==='style'||attr.name==='srcdoc')el.removeAttribute(attr.name);if(['href','src'].includes(attr.name)&&!/^(https?:|mailto:|\/|#|data:image\/(?:png|jpeg|gif|webp);)/i.test(attr.value))el.removeAttribute(attr.name);});if(el.tagName==='A'){el.rel='noopener noreferrer';el.target='_blank';}});
  const fragment=document.createDocumentFragment();while(doc.body.firstChild)fragment.append(doc.body.firstChild);return fragment;
 }
 function collapseQuotes(container){$$('blockquote,.gmail_quote,#divRplyFwdMsg',container).forEach(quote=>{if(quote.closest('details'))return;const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Show quoted message';quote.before(details);details.append(summary,quote);});}
 function applyViewToggle(){$$('[data-event-kind=history]',timeline).forEach(el=>el.hidden=/view/i.test(el.dataset.action||'')&&!$('#uxShowViews').checked);}
 $('#uxShowViews').onchange=applyViewToggle;
 function sortFallback(){const rows=$$('[data-created]',timeline);rows.sort((a,b)=>new Date(b.dataset.created.replace(/(?<!Z)$/,'Z'))-new Date(a.dataset.created.replace(/(?<!Z)$/,'Z')));rows.forEach(el=>timeline.append(el));$$('.ux-message-body').forEach(collapseQuotes);}
 sortFallback();
 let current={};let loading=false;
 function permission(canEdit){root.dataset.canEdit=String(canEdit);$$('[data-workspace-field],#uxResolve').forEach(el=>el.disabled=!canEdit);}
 function dueBadge(value){
  const badge=$('#uxDueBadge');if(!value||['resolved','closed'].includes(current.status)){badge.hidden=true;return;}
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:ux.timezone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(v=>[v.type,v.value]));
  const today=`${p.year}-${p.month}-${p.day}`,due=value.slice(0,10);badge.hidden=false;badge.textContent=due<today?'Overdue':due===today?'Due today':'Due '+due;badge.style.color=due<today?'var(--cc-bad)':'var(--ux-secondary)';
 }
 async function load(){
  if(loading)return;loading=true;
  try{
   const data=await ux.request(`/tickets/api/${id}/workspace`);current=data.ticket;permission(data.can_edit);
   $$('[data-workspace-field]').forEach(el=>{const field=el.dataset.workspaceField;el.value=field==='due_date'?(current[field]||'').slice(0,10):(current[field]??'none');el.dataset.saved=el.value;});
   $('#uxRequesterName').textContent=current.requester_name||'Unknown requester';$('#uxRequesterEmail').textContent=current.requester_email||'No email recorded';$('#uxRequesterEmail').href=current.requester_email?'mailto:'+current.requester_email:'#';
   $$('[data-workspace-time]').forEach(el=>{el.dataset.uxTime=current[el.dataset.workspaceTime]||'';});dueBadge(current.due_date);
   const past=$('#uxPastTickets');past.replaceChildren();if(!data.past_tickets?.length)past.textContent='No other tickets from this requester.';else data.past_tickets.forEach(t=>{const a=document.createElement('a');a.href=`/tickets/${t.id}`;a.className='d-block small mb-2';a.textContent=`#${t.id} · ${t.title} · ${t.status.replace('_',' ')}`;past.append(a);});
   timeline.replaceChildren();
   (data.timeline||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).forEach(event=>{
    let article=event.kind==='comment'?savedComments.get(String(event.id)):null;
    if(!article){article=document.createElement('article');article.className='ux-activity';}
    article.dataset.eventKind=event.kind;article.dataset.eventId=event.id;article.dataset.action=event.action||'';article.dataset.created=event.created_at;
    let header=$('header',article);if(!header){header=document.createElement('header');article.prepend(header);}
    const deleteButton=$('button',header)?.cloneNode(true);header.replaceChildren();
    const author=document.createElement('strong');author.textContent=event.author||'System';header.append(author);
    const meta=document.createElement('div');meta.className='ux-tools';if(event.kind==='comment'){const badge=document.createElement('span');badge.className='ux-chip';badge.textContent=event.visibility==='internal'?'Internal note':'Public reply';meta.append(badge);}
    const time=document.createElement('time');time.dataset.uxTime=event.created_at;meta.append(time);if(deleteButton)meta.append(deleteButton);header.append(meta);
    let body=$('.ux-message-body',article);if(!body){body=document.createElement('div');body.className='ux-message-body';article.append(body);}
    if(event.kind==='comment'){body.replaceChildren(safeFragment(event.content));collapseQuotes(body);if(event.quoted_content){const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='Show quoted message';details.append(summary,safeFragment(event.quoted_content));body.append(details);}}
    else{article.replaceChildren(header,body);body.textContent=`${(event.action||'Activity').replaceAll('_',' ')}${event.details?' · '+event.details:''}`;body.classList.add('small','text-muted');}
    timeline.append(article);
   });
   if(!data.timeline?.length){const empty=document.createElement('p');empty.className='p-3 text-muted mb-0';empty.textContent='No activity yet. Start the conversation above.';timeline.append(empty);}
   applyViewToggle();ux.dates();$('#uxWorkspaceError').hidden=true;
   const status=$('#ux-ticket-status');status.className='form-select ux-pill-select tk-pill-st-'+current.status;
   $('#uxResolve').textContent=current.status==='resolved'?'Reopen ticket':'Resolve ticket';
  }catch(err){const error=$('#uxWorkspaceError');error.hidden=false;error.textContent='Could not load the latest workspace. '+err.message+' ';const b=document.createElement('button');b.className='btn btn-sm btn-outline-secondary';b.textContent='Retry';b.onclick=load;error.append(b);$('#uxPastTickets').textContent='Requester history unavailable. Retry loading the workspace.';}finally{loading=false;}
 }
 $$('[data-workspace-field]').forEach(el=>{el.dataset.saved=el.value;el.addEventListener('change',async()=>{const previous=el.dataset.saved,field=el.dataset.workspaceField;el.disabled=true;try{await ux.post(`/tickets/api/${id}/quick-update`,{field,value:['priority','category_id'].includes(field)?Number(el.value):el.value});el.dataset.saved=el.value;ux.toast('Ticket updated');await load();}catch(err){el.value=previous;ux.toast(err.message,true);}finally{el.disabled=root.dataset.canEdit!=='true';}});});
 $('#uxResolve').onclick=async()=>{const b=$('#uxResolve');b.disabled=true;try{await ux.post(`/tickets/api/${id}/quick-update`,{field:'status',value:current.status==='resolved'?'open':'resolved'});ux.toast(current.status==='resolved'?'Ticket reopened':'Ticket resolved');await load();}catch(err){ux.toast(err.message,true);}finally{b.disabled=root.dataset.canEdit!=='true';}};
 document.addEventListener('ux-ticket-updated',()=>load());
 // Pinned summaries are per-viewer convenience, never silently sent to the requester.
 const key='post-pinned-summary-'+id;
 function pin(text){$('[data-pinned-content]').textContent=text;$('#uxPinnedSummary').hidden=!text;try{localStorage.setItem(key,text);}catch(_){}}
 try{pin(localStorage.getItem(key)||'');}catch(_){}
 $('#uxPinAI').onclick=()=>{const messages=$$('[data-ai-conversation] .ticket-ai-message').filter(el=>!el.classList.contains('ticket-ai-message-user'));const last=messages.at(-1);const text=last?.querySelector('.ticket-ai-content')?.textContent;if(!text){ux.toast('There is no completed analysis to pin yet.',true);return;}pin(text);ux.toast('Summary pinned for your workspace');};
 $('#uxUnpin').onclick=()=>pin('');
 load();
});
</script>
