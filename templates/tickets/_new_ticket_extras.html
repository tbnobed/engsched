<div class="field mb-3">
 <label for="uxRequester" class="form-label">Requester</label>
 <input type="hidden" name="requester_id" value="0">
 <input type="text" id="uxRequester" class="form-control" data-requester-search aria-controls="uxRequesterResults" autocomplete="off" placeholder="Search directory by name or email">
 <div class="form-text">Leave blank to create for yourself. Choose a result to create on behalf of someone else.</div>
 <div id="uxRequesterResults" role="region" aria-live="polite" aria-label="Directory matches"></div>
</div>
<div class="field mb-3">
 <span class="form-label d-block">Due date shortcuts</span>
 <div class="ux-tools"><button type="button" class="btn btn-sm tk-btn" data-due-offset="0">Today</button><button type="button" class="btn btn-sm tk-btn" data-due-offset="1">Tomorrow</button><button type="button" class="btn btn-sm tk-btn" data-due-offset="7">Next week</button></div>
</div>
<div class="field mb-3">
 <button type="button" class="btn btn-sm tk-btn" data-triage>Suggest category &amp; priority</button>
 <p class="form-text">AI suggestions are optional. Nothing is applied until you choose it.</p>
 <div data-triage-result class="p-3 border rounded small" role="status" hidden></div>
</div>
