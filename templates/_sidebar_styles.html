<style>
/* Shared navigation: preserve the application's blue-gray visual language. */
body.app-sidebar-layout {
    --sidebar-width: 244px;
    --sidebar-bg: #0f1624;
    --sidebar-text: #e6ecf5;

    --sidebar-border: #253246;
    --sidebar-accent: #92bcea;
    --sidebar-hover: #1b2b41;
    padding: 0 0 0 var(--sidebar-width) !important;
    min-height: 100vh;
    min-height: 100dvh;
}
body.app-sidebar-layout.light-theme {
    --sidebar-bg: #f2f6f8;
    --sidebar-text: #20394b;
    --sidebar-muted: #586f80;
    --sidebar-border: #d5e0e7;
    --sidebar-accent: #235e86;
    --sidebar-hover: #dfeaf1;
}
.app-sidebar {
    display: flex;
    flex-direction: column;
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--sidebar-width);
    height: 100vh;
    height: 100dvh;
    z-index: 1040;
    overflow: auto;
    overscroll-behavior: contain;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);

    position: sticky;

    background: var(--sidebar-bg);
}
.app-sidebar-brand {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0;
    color: var(--sidebar-text);
    text-decoration: none;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .01em;
    overflow-wrap: anywhere;
}
.app-sidebar-brand:hover { color: var(--sidebar-accent); }
.app-sidebar-brand img { width: auto; height: 32px; max-width: 80px; object-fit: contain; }
.app-sidebar-list, .app-sidebar-sublist { list-style: none; margin: 0; padding: 0; }

    font-size: 13px;

.app-sidebar-toggle { cursor: pointer; }

.app-sidebar-toggle[aria-expanded="true"]::after { transform: rotate(225deg); }
.app-sidebar-link:hover, .app-sidebar-toggle:hover, .app-sidebar-link[aria-current="page"] {

.app-sidebar :focus-visible, .app-menu-button:focus-visible, .app-sidebar-backdrop:focus-visible {

}
.app-sidebar-sublist {
    margin: 4px 0 10px 14px;
    padding-left: 8px;
    border-left: 1px solid var(--sidebar-border);
}
.app-sidebar [hidden] { display: none !important; }
.app-sidebar-sublist .app-sidebar-link { color: var(--sidebar-muted); font-size: 12px; }
.app-sidebar-sublist .app-sidebar-link:hover,
.app-sidebar-sublist .app-sidebar-link[aria-current="page"] { color: var(--sidebar-accent); }

.app-sidebar-username { min-width: 0; overflow-wrap: anywhere; }
.app-sidebar-form { padding: 8px; }
.app-sidebar-form label { display: block; font-size: 12px; color: var(--sidebar-muted); margin-bottom: 6px; }
.app-sidebar-form select {

.app-sidebar-form button { border: 1px solid var(--sidebar-border); justify-content: center; }

body.app-sidebar-layout > main.mobile-content { min-height: 100dvh; }

body.app-sidebar-layout .timeline-container,
body.app-sidebar-layout .timeline-wrapper,
body.app-sidebar-layout .timeline-scroll,

        padding: 0 16px;

        border-bottom: 1px solid var(--sidebar-border);

        font-weight: 600;

        inset: 0;
        border: 0;
        background: rgba(7, 15, 26, .58);
        z-index: 1039;
    }
    body.app-sidebar-layout > main.mobile-content { min-height: calc(100dvh - 56px); }
}
@media (prefers-reduced-motion: reduce) {
    .app-sidebar, .app-sidebar-toggle::after { transition: none; }
}
</style>
